# Render Blueprint Specification for MerchantAssist production services.
# The production database is Neon PostgreSQL; DATABASE_URL is managed in Render.
# The legacy Render PostgreSQL resource is retained temporarily for rollback only.

version: "1"

services:
  # Backend API Web Service
  - type: web
    name: magicpin-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    # Note: Free web services do not support preDeployCommand.
    # In single-instance free tier, migrations execute safely at startup prior to port binding.
    startCommand: alembic -c backend/alembic.ini upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/readyz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: "Magicpin AI Agent"
      - key: SECRET_KEY
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false  # Configure the Neon connection securely in the Render dashboard.
      - key: FRONTEND_ORIGIN
        value: "https://magicpin-frontend.onrender.com"
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_API_KEY
        sync: false  # Sensitive secret: configure securely in Render dashboard
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "lax"
      - key: LOG_LEVEL
        value: INFO
      - key: SESSION_TTL_MINUTES
        value: "10080"
      - key: RATE_LIMIT_LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: RATE_LIMIT_LOGIN_WINDOW_SECONDS
        value: "900"
      - key: TRUSTED_PROXIES
        value: "127.0.0.1,::1"  # Update with trusted upstream reverse proxy IPs (Render or Cloudflare) via Render dashboard

  # Frontend Static Application
  - type: web
    name: magicpin-frontend
    runtime: static
    # Note: Static sites are hosted on Render's global CDN, are free by default, and do not accept a plan field.
    buildCommand: npm --prefix frontend ci && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    routes:
      # API Proxy Rewrite: routes /v1/* to the backend web service preserving path and cookies.
      # Note: 'https://magicpin-backend.onrender.com' assumes default subdomain availability.
      # If Render allocates a suffixed hostname (e.g. magicpin-backend-xxxx.onrender.com),
      # update this destination to match the actual allocated backend URL.
      - type: rewrite
        source: /v1/*
        destination: https://magicpin-backend.onrender.com/v1/*
      # SPA Catch-all: routes all other paths to index.html for client-side routing.
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # Legacy Render PostgreSQL resource retained temporarily for rollback.
  # It is intentionally not referenced by the backend DATABASE_URL.
  - name: magicpin-postgres
    databaseName: magicpin_ai_agent
    user: magicpin
    region: oregon
    plan: free
    postgresMajorVersion: 16
